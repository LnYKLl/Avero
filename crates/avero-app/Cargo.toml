[package]
name = "avero-app"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"

[dependencies]
avero-autoconfig = { path = "../avero-autoconfig" }
avero-core = { path = "../avero-core" }
avero-oauth = { path = "../avero-oauth" }
avero-sync = { path = "../avero-sync" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6"
# iced's default features minus `wgpu`: software rendering (tiny-skia) by
# default, which uses far less memory. See docs/memory.md.
# `svg` draws the Lucide icons, `tokio` gives `time::every` (auto sync).
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "crisp", "web-colors", "linux-theme-detection", "x11", "wayland", "svg", "tokio"] }
# Same version as the one iced uses for SVG: rasterises the window icon.
resvg = "0.45"
# System notifications for new mail: WinRT toasts on Windows, the
# Notification Center on macOS, D-Bus (zbus) elsewhere. Default features:
# zbus then brings its own executor, so a notification can be shown from
# a plain thread. 4.18 needs rustc 1.89.
notify-rust = "4.18"
# Native "Open" / "Save as" dialogs (xdg-portal on Linux, no GTK).
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54", features = ["rt", "sync", "net", "time", "macros"] }
webbrowser = "1.2.5"

[features]
# `cargo build --features gpu` adds the GPU renderer (wgpu). iced then
# prefers it and falls back to tiny-skia if no GPU is available.
gpu = ["iced/wgpu"]

[dev-dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
keyring = "4.2"
tokio = { version = "1.54", features = ["macros", "rt"] }
