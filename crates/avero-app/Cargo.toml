[package]
name = "avero-app"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
description = "Avero, a lightweight desktop email client"

[dependencies]
avero-autoconfig = { path = "../avero-autoconfig" }
avero-core = { path = "../avero-core" }
avero-oauth = { path = "../avero-oauth" }
avero-sync = { path = "../avero-sync" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6"
# iced's default features minus `wgpu`: software rendering (tiny-skia) by
# default, which uses far less memory. See docs/memory.md.
# `svg` draws the Lucide icons, `tokio` gives `time::every` (auto sync).
iced = { version = "0.14", default-features = false, features = ["advanced", "tiny-skia", "crisp", "web-colors", "linux-theme-detection", "x11", "wayland", "svg", "tokio"] }
# Same version as the one iced uses for SVG: rasterises the window icon.
resvg = "0.45"
# System notifications for new mail: WinRT toasts on Windows, the
# Notification Center on macOS, D-Bus (zbus) elsewhere. Default features:
# zbus then brings its own executor, so a notification can be shown from
# a plain thread. 4.18 needs rustc 1.89.
notify-rust = "4.18"
# One-click unsubscribe (RFC 8058): same reqwest and rustls set-up as
# avero-oauth and avero-autoconfig (ring, no default TLS), so no new crate.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Native "Open" / "Save as" dialogs (xdg-portal on Linux, no GTK).
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54", features = ["rt", "sync", "net", "time", "macros"] }
webbrowser = "1.2.5"

# Windows only: gives the process Avero's AppUserModelID (notifications,
# taskbar), and keeps Avero to one window per user (a named mutex, then
# the running window brought to the front). Already in the dependency tree
# (through iced and others), so no new crate: only more of its bindings.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Windows only: puts the icon and the version details (name, description,
# version from Cargo) inside avero.exe. Without its default `toml` feature
# it has no dependency at all; no declared MSRV, plain std Rust.
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[features]
# `cargo build --features gpu` adds the GPU renderer (wgpu). iced then
# prefers it and falls back to tiny-skia if no GPU is available.
gpu = ["iced/wgpu"]

[dev-dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
keyring = "4.2"
tokio = { version = "1.54", features = ["macros", "rt"] }
