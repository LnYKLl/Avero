[package]
name = "avero-oauth"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
description = "OAuth2 loopback flow (Google, Microsoft) for Avero"

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["net", "time", "io-util", "rt", "macros", "sync"] }
url = "2.5.8"
webbrowser = "1.2.5"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
